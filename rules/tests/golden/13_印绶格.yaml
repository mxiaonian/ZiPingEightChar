  derived: "第一步定月令申（四长生，藏庚壬戊）；第二步壬日对申本气庚→偏印，正偏同格定印绶格；第三步本气庚不透而月干透戊——按回修后总纲第三步/R-纲-07 所补『辨主从』：透干戊煞生本气庚印（透干生本气），本气庚当令有力，为变而不失本格，本气仍主格、戊煞为相（规则正文即据本造核：『壬生申月透戊，煞生印而印格用煞』）；年时三壬并透、日支辰为水库、申辰拱水（R-纲-08 已补半合拱局）助身，身重印轻成立。R-印-06 条件（透煞、身印一轻一重）触发→印绶格/成/用庚印、相神戊煞。"
  result: "match"
  note: "上一轮所指两点规则缺口，回修后均已消解：①路由张力——本气庚不透而透戊煞，旧版 R-纲-07 字面『格随透干变』偏向偏官格，与书判『印格用煞』相左；回修后总纲第三步与 R-纲-07 补『辨主从』（透干与本气相生、本气当令有力者本气主格，透干为相为兼），且以本造为核验例，印格用煞成立。②申辰拱水之半合拱局，R-纲-08 已补『力稍逊亦足参变化』，此处拱水仅助身、不夺印格。回修后已消解。"


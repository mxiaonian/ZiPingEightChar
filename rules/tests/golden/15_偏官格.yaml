# 黄金命例：偏官格  来源：15_偏官格.md 命例栏
- id: 杀-M01
  name: "无名"
  pillars: ["乙亥", "乙酉", "乙卯", "丁丑"]
  book_verdict: "煞用食制，煞旺食强而身健，极等之贵也"
  expected: "偏官格/成/用神酉辛七煞，相神丁食制煞，煞旺食强身健，极贵"
  source: "《子平真诠》第三十九篇·论偏官"
  derived: "偏官格/成：乙日生酉月，酉本气辛为乙日七煞（阴克阴），总纲第二步定格；酉为专气，第三步无透干变化；日支卯与月令酉相冲，年支亥与日支卯半会木局，依 R-附-20 会合解冲（R-纲-08 回修后半合拱局亦明入会支之例），卯会亥而不冲酉，月令不化，第四步无格变；时干透丁食神制煞，煞当令而旺、乙日坐卯禄兼三乙并透则身健，R-杀-03 条件全触发→成格，用神七煞、相神丁食"
  result: "match"
  note: "丁食四支无火根，书径判「食强」（盖取三乙相生），规则库于「食强」无量化界说，依书判触发，不碍结论；余无问题（与上轮同）"
- id: 杀-M02
  name: "脱脱丞相"
  pillars: ["壬辰", "甲戌", "丙戌", "戊戌"]
  book_verdict: "辰中暗煞，壬以透之；戊食坐四支，食太重而透甲印以损太过，岂非贵格"
  expected: "偏官格（壬煞为用）/救/食制煞而食太重，甲印居食先损其太过，败中有救，成格大贵"
  source: "《子平真诠》第三十九篇·论偏官"
  derived: "总纲路由：丙日生戌月，戌本气戊为丙日食神，第二步定食神格；戊透时干（本气透，R-纲-10 杂气透干取用），第三步无格变。年干透壬七煞（通根年支辰中癸，非月令戌所出——戌藏戊辛丁无水），月干透甲印，四柱不透财：食神格 R-食-03（弃食就煞印）条件全触发，且 R-食-09 回修排他（煞印同透、可弃食就煞印者不为破）明定甲印夺食之嫌不破→成格威权之贵。另依本书系篇之路（以壬煞为用走偏官规则）：时透戊食、四支辰戌戌戌皆土，食太重；月干甲印居食先，R-杀-11 带忌（透印）而 R-杀-14 救应触发（印先食后、食太旺得印制）→败中有救，格成大贵。两线同归成格，与书判合"
  result: "match"
  note: "三事并存：(1) 原文月柱作「甲胡」，十干十二支无胡字，系传抄之误，通行本作甲戌，命例栏已存疑，兹照甲戌排；(2) 年月干支失配——壬辰年九月依五虎遁当为庚戌，甲戌月属甲己之年，四柱照录存疑；(3) 路由出入仍未消解：总纲六步路由（用神专求月令）导此造入食神格，而本书系于偏官格下示范 R-杀-14（煞出年支辰、非月令所出）；回修之 R-食-09 排他使食神格一线更明（夺食不为破、转 R-食-03），但「煞出他支之造系于何格」之归属界说规则库仍阙如，属可补之处"
- id: 杀-M03
  name: "何参政"
  pillars: ["丙寅", "戊戌", "壬戌", "辛丑"]
  book_verdict: "戊与辛同通月令（戌中藏戊辛），是煞印有情，贵格"
  expected: "偏官格/成/用神戌中戊煞，相神辛印化煞，煞印同通月令为有情"
  source: "《子平真诠》第三十九篇·论偏官"
  derived: "偏官格/成：壬日生戌月，戌本气戊为壬日七煞（阳克阳），总纲第二步定格；戌藏戊辛丁，月干透戊（本气透）、时干透辛印——回修后 R-纲-07 辨主从：本气戊与透干辛相生（土生金，本气生透干）且本气当令有力，本气仍主格、透干为相为兼，即该条所举「何参政造戌中辛印透而戊煞相生」之例，煞格用印，第三步无格变；辛印与戊煞同通月令戌，R-杀-04 条件全触发（印有情）→成格，用神七煞、相神辛印"
  result: "match"
  note: "年干丙偏财与辛印分居年时、中隔两位，按 R-附-11 仅半合（十之二三），书未论，不碍成格；丑戌刑属四墓相刑，依 R-纲-11 不忌。回修后 R-纲-07 径以本造为「本气生透干、本气主格」之例，路由依据较上轮更明"
- id: 杀-M04
  name: "周丞相"
  pillars: ["戊戌", "甲子", "丁未", "庚戌"]
  book_verdict: "戊被（甲）制不能伏煞，时透庚财，去印存食以清食，兼生不足之煞；生煞即以制煞，两得其用，尤为大贵"
  expected: "偏官格/成/用神子癸七煞，戊伤制煞被甲印所制，相神庚财去印存食、兼生煞，两得其用，尤为大贵"
  source: "《子平真诠》第三十九篇·论偏官"
  derived: "偏官格/成：丁日生子月，子本气癸为丁日七煞（阴克阴），总纲第二步定格；子为专气，第三步无透干变化；年干透戊伤官制煞，月干透甲正印紧贴克戊（伤被印制、不能伏煞），时干透庚正财居时得位、庚克甲而去印存食，R-杀-06 条件全触发（月令七煞、透食（伤）制煞、食被印克制、透财得位去印存食）→成格，用神七煞、相神庚财，存食制煞与生不足之煞两得其用，尤为大贵"
  result: "match"
  note: "日支未与月令子有子未之害，书未论，规则条件亦未以害入破格，记此备查（与上轮同，无变化）"
- id: 杀-M05
  name: "刘运使"
  pillars: ["甲申", "乙亥", "丙戌", "庚寅"]
  book_verdict: "身重煞轻，煞又化印，用神不清，借（庚）财以清格，亦为贵格"
  expected: "偏官格/成/用神亥中壬煞，身重煞轻、煞化印而用神不清，相神庚财损印清格"
  source: "《子平真诠》第三十九篇·论偏官"
  derived: "偏官格/成：丙日生亥月，亥本气壬为丙日七煞（阳克阳），总纲第二步定格；亥藏壬甲，本气壬不透而年透甲、月透乙（印）——回修后 R-纲-07 辨主从：透干与本气相生（水生木，本气生透干）且本气当令有力，本气仍主格、透干为相为兼，变而不失本格，煞格兼印并论；丙日通根戌库（R-附-18 丙逢戌作通根论）、寅为丙之长生，印又生身→身重；煞仅亥中壬一点且化印→煞轻、用神不清；时干透庚偏财、禄于年支申，R-杀-07 条件全触发（身重煞轻、煞又化印、用神不清、透财）→成格，用神七煞、相神庚财（借财清格）"
  result: "match"
  note: "透干变化使格兼印绶，回修后 R-纲-07 辨主从（本气生透干、本气主格）直接支撑「煞格兼印」之判，依据较上轮更明；申亥相害书未论（与上轮同）"
- id: 杀-M06
  name: "岳统制"
  pillars: ["癸卯", "丁巳", "庚寅", "庚辰"]
  book_verdict: "月令偏官而官透，去官留煞也，取清则贵"
  expected: "偏官格/成/用神巳中丙煞，丁官透干混杂，相神癸伤去官留煞取清"
  source: "《子平真诠》第三十九篇·论偏官"
  derived: "偏官格/成：庚日生巳月，巳本气丙为庚日七煞（阳克阳），总纲第二步定格；巳藏丙戊庚，月干所透丁官非巳中藏干，不涉第三步透干格变，作煞格官透混杂论；年干透癸伤官（通根时支辰中癸）紧贴克丁，局中有字去官，R-杀-09 条件触发（月令七煞、官透混杂、有字去官）→去官留煞取清成格，用神七煞、相神癸伤"
  result: "match"
  note: "地支寅卯辰三会东方财方（日寅、年卯、时辰连珠），财旺党煞之嫌书未论，R-杀-09 条件亦未设此限，记此备查（与上轮同，无变化）"
- id: 杀-M07
  name: "沈郎中"
  pillars: ["丙子", "甲午", "辛亥", "辛卯"]
  book_verdict: "子冲午而克煞，是去煞留官也"
  expected: "偏官格杂官/成/子冲午去煞，留丙官取清"
  source: "《子平真诠》第三十九篇·论偏官"
  derived: "偏官格/成（取清）：辛日生午月，午本气丁为辛日七煞（阴克阴），总纲第二步定格；午藏丁己，年干所透丙官非午中藏干，不涉第三步透干格变，作煞格官透混杂论；年支子冲月令午、子中癸克午中丁，局中有字去煞，R-杀-09 条件触发→去煞留官取清成格，格实转以丙官为用（丙辛本身之合，依 R-附-13 不为合去，官亲日主）"
  result: "match"
  note: "规则张力仍未消解：此造之「去煞」系年支子冲坏月令午中丁煞——月令用神被冲而书反以为成格，与 R-附-23「刑冲月令用神尤为破格」之原则相悖，且 R-杀-09 判定明言「月令偏官，煞为用而官非用……（煞格）去官留煞，其清如此」，此造反向去煞留官，其理原文未明言，命例栏已存疑；回修未及 R-杀-09，上轮所请补注（「去煞留官限于煞被冲去、官有根且亲日主之情形」之类界说）仍未补。旁证自圆处：丙辛为日主自合（R-附-13）、丙官通根午（丙刃于午），留官为用尚可说"
- id: 杀-M08
  name: "赵员外"
  pillars: ["戊辰", "甲寅", "戊寅", "戊午"]
  book_verdict: "有煞无食制而用印当者——甲煞透而无食制，寅午会火，以印（刃）化敌其煞"
  expected: "偏官格/成/用神寅中甲煞，无食制，寅午会火印（刃）当煞化敌"
  source: "《子平真诠》第三十九篇·论偏官"
  derived: "偏官格/成：戊日生寅月，寅本气甲为戊日七煞（阳克阳），总纲第二步定格；甲透月干（本气透），第三步无格变；四柱无金、无食制煞，日支寅与时支午半合拱火（回修后 R-纲-08 明定半合拱局亦足参变化），火为戊日之印、午兼戊刃，支会印局化煞而月令本气不夺，R-杀-10 条件全触发（月令七煞、无食制、支会印局以化煞）→成格，用神七煞、相神印（印刃当煞）"
  result: "match"
  note: "R-杀-10 作「用印当煞」、R-杀-21 作「用刃当煞」，此造寅午会火、火为印而午为刃，印刃同宫，二说相通，规则条已并存存疑，回修未合并二条措辞，存疑照旧；回修之 R-纲-08（半合拱局亦足参变化）使本造会支依据较上轮更明。推导两说均至成格"

# 黄金命例：伤官格  来源：16_伤官格.md 命例栏
- id: 伤-M01
  name: "史春芳"
  pillars: ["壬午", "己酉", "戊午", "庚申"]
  book_verdict: "伤官生财，身强有根，贵格"
  expected: "伤官格/成/伤官生财：用神酉金伤官，相神壬偏财（透干通根申），身强有根"
  source: "第四十一篇·论伤官"
  derived: "月令酉藏辛，辛为戊日伤官→伤官格（总纲第二步）；酉为专气无透干变化；壬偏财透、通根申中壬水，伤官生财；戊坐午印、年支又午、月干己劫、申中藏戊，身强有根→R-伤-03条件全触发；无印透、无破格项触发→伤官生财成格贵格"
  result: "match"
  note: ""

- id: 伤-M02
  name: "罗状元"
  pillars: ["甲子", "乙亥", "辛未", "戊子"]
  book_verdict: "辛日亥月透甲，甲通根于亥又会未成木局，化水为木、化伤生财，秀气发越，殿元"
  expected: "伤官格/成/化伤为财：用神亥水伤官，透甲财通根月令、亥未会木局，冬金化木则秀而贵"
  source: "第四十一篇·论伤官"
  derived: "月令亥本气壬为辛日伤官→伤官格（总纲第二步）；亥为四生月，本气壬不透而透甲（亥藏甲）：辨主从——壬水生甲木，本气生透干，且壬水当令有力，属「变而不失本格」，本气壬伤官仍主格、甲财为相（总纲第三步/R-纲-07）；甲通根亥、亥未半会木局（财局）→R-伤-04化伤为财触发；亥月冬金伤官化木，R-伤-19秀贵（殿元）→成格"
  result: "match"
  note: "亥未半会木局缺卯，属拱局，书谓「然又会未成局，化水为木」。回修后总纲第三步/R-纲-07补「辨主从」，本造由上一轮「格随透干变」改判为「变而不失本格」（本气伤官主格、透财为相），与expected「用神亥水伤官」更相合，结论不变"

- id: 伤-M03
  name: "秦龙图"
  pillars: ["己卯", "丁丑", "丙寅", "庚寅"]
  book_verdict: "丙日丑月，己与庚同根月令，财伤有情，秀气与化伤为财不相上下"
  expected: "伤官格/成/财伤有情：用神丑土伤官，伤（己）财（庚）同根月令并透，伤官生财"
  source: "第四十一篇·论伤官"
  derived: "月令丑本气己为丙日伤官→伤官格；本气己透、庚财亦透，伤官生财；丙坐两寅长生、年支卯印、月干丁劫，身强有根→R-伤-03触发成格；按书及R-伤-05文义「己与庚同根月令」，财伤有情，秀气尤胜→成格贵格"
  result: "match"
  note: "藏干细节存疑：通行藏干丑藏己癸辛，庚非丑藏干，「己庚同根月令」须按庚借根丑库（金库）理解；R-伤-05条件字面「财星与伤官同根于月令藏干」与通行藏干表有出入，但规则与书原文表述一致，成格结论不受影响（R-伤-03独立成立）"

- id: 伤-M04
  name: "孛罗平章"
  pillars: ["壬申", "丙午", "申午", "壬申"]
  book_verdict: "伤官佩印，伤官旺、印根深、身又弱，夏木逢润，其秀百倍，一品之贵"
  expected: "伤官格/成/伤官佩印：用神伤官，相神壬水印（印根深），夏木逢润，格至一品"
  source: "第四十一篇·论伤官"
  derived: "第三柱「申午」非六十甲子合法干支（两支相拼），日干无法确定，正式排盘不能；按书判语「夏木逢润」反推日干应为木（疑日柱为甲午）：午月丁为甲日伤官→伤官格，壬印两透坐双申长生（印根深）、甲地支无根（身弱）、伤当令而旺→R-伤-06、R-伤-20可触发，结论与expected一致，但纯属推测"
  result: "unverifiable"
  note: "第三柱干支失配（「申午」不可能），疑脱天干；原书（sources/42_论伤官.md）即如此，文件存疑注已录。仅可条件性复推，不能确证"

- id: 伤-M05
  name: "都统制"
  pillars: ["丁酉", "己酉", "戊子", "壬子"]
  book_verdict: "伤官生财而财太重带印，丁与壬隔以戊己两不相碍，金水多寒得火融和，贵"
  expected: "伤官格/成/伤官生财、财太旺带印：用神酉金伤官，壬财透通根两子，丁印与壬财间隔得清，得火调候格高"
  source: "第四十一篇·论伤官"
  derived: "月令酉藏辛为戊日伤官→伤官格；壬偏财透、通根双子，财太重；戊地支无根（酉子酉子无土），身弱财旺；丁正印透→R-伤-07情形一「生财者财太旺而带印」触发；丁居年干、壬居时干，隔月干己、日干戊，两不相碍→R-伤-16间隔为救触发；金水多寒，得丁火融和调候→R-伤-21（回修后已放宽，不限金水日元，明引本造戊日酉月土金伤官亦以此论）触发，格高→成格贵格"
  result: "match"
  note: "上一轮指出R-伤-21条件限「金水伤官格」、对本造（土金伤官）字面失效；回修后R-伤-21条件已放宽并明引本造，问题回修后已消解"

- id: 伤-M06
  name: "某丞相"
  pillars: ["壬戌", "己酉", "戊午", "丁巳"]
  book_verdict: "伤官佩印而印太重带财，丁与壬隔以戊己不相碍，贵至丞相"
  expected: "伤官格/成/伤官佩印、印太重带财：用神酉金伤官，相神丁印（透而根深），壬财与丁印间隔两清"
  source: "第四十一篇·论伤官"
  derived: "月令酉藏辛为戊日伤官→伤官格；丁正印透、通根午戌巳，印太重；壬偏财透→R-伤-07情形二「佩印者印太重而带财」触发；丁居时干、壬居年干，隔己戊→R-伤-16触发；身强（坐午、时巳禄、年支戌），R-伤-06「身稍弱」字面不适用，应走R-伤-07；R-伤-12破格三条件（伤轻+身重+印偏正叠出）未并具（伤当令不轻、仅丁透无叠出），不破→成格贵格"
  result: "match"
  note: "规则适用边界：本造身强，若机械套R-伤-06「日干稍弱」则不触发，须走R-伤-07情形二；规则本身自洽，但佩印类命例条件边界值得留意"

- id: 伤-M07
  name: "蔡贵妃"
  pillars: ["己未", "丙子", "庚子", "丙子"]
  book_verdict: "伤官用煞印，伤多身弱，赖煞生印帮身制伤，无财，贵格"
  expected: "伤官格/成/伤官用煞印：用神子水伤官，相神己印（赖丙煞生之），无财"
  source: "第四十一篇·论伤官"
  derived: "月令子藏癸为庚日伤官→金水伤官格；地支三子、伤多；庚地支无根（子未皆无金根），身弱；丙七煞两透、己正印透，煞生印、印帮身制伤；财不透干（未中藏乙正财，藏支不碍）→R-伤-08（回修后条件明定为「财不透干，藏支不碍」，并引本造为证）触发；R-伤-14（透财）不破→成格贵格"
  result: "match"
  note: "上一轮指出R-伤-08「四柱无财」若含藏干则字面不满足，建议改为「财不透干」；回修后R-伤-08条件已改为「财不透干（藏支不碍，如蔡贵妃造未中藏乙仍成）」，问题回修后已消解"

- id: 伤-M08
  name: "夏阁老"
  pillars: ["壬寅", "丁未", "丙寅"]
  book_verdict: "伤官用煞印，煞因伤而有制、两得其宜，无财，贵格"
  expected: "伤官格/成/伤官用煞印：用神未土伤官，壬煞有制，无财"
  source: "第四十一篇·论伤官"
  derived: "缺时柱。月令未本气己为丙日伤官→伤官格；壬七煞透、坐寅（壬水病地，煞弱）；丙坐两寅长生、丁劫透，身强而非身弱；甲偏印藏寅不透→R-伤-08条件「伤多日干弱」「透煞与印」字面均未触发；实存结构为伤官制煞；时柱未知，「财不透干」条件无法核验"
  result: "unverifiable"
  note: "原文仅录三柱，疑脱时柱（sources/42_论伤官.md 即如此）；时柱可能带财或印，「财不透干」与身弱条件均无法核验。上一轮指出的规则张力（命例栏标R-伤-08，而条件「伤多身弱、透煞与印」与本造身强、印藏不透不符）回修后已在R-伤-08存疑注中明录（「夏阁老造仅录三柱……与『身弱』『透印』字面有张力」）；惟缺时柱，仍无法确证"


- id: 伤-M11
  name: "章丞相"
  pillars: ["甲子", "壬申", "己亥", "辛未"]
  book_verdict: "非金水而见官，然化伤为财、伤非其伤，作财旺生官而不作伤官见官，贵至丞相"
  expected: "伤官格/成/化伤为财、财旺生官：用神申金伤官，壬财透通根月令、申子会水，甲官作财旺生官论，不作伤官见官"
  source: "第四十一篇·论伤官"
  derived: "月令申本气庚为己日伤官→伤官格（土金伤官，非金水）（总纲第二步）；甲己日干逢合，但化神土不当令（申月）、支局不全，不入从化门（总纲第六步）；申为四生月，本气庚不透而透壬（申藏壬）：辨主从——庚金生壬水，本气生透干，且庚金当令有力，属「变而不失本格」，本气庚伤官仍主格、壬财为相（总纲第三步/R-纲-07）；壬财通根申、申子半合水局（财局）→R-伤-04化伤为财触发；甲正官透，R-伤-11触发：局已化伤为财，作财旺生官、不作伤官见官→成格贵格"
  result: "match"
  note: "回修后总纲第三步/R-纲-07补「辨主从」，本造由上一轮「格随透干变」改判为「变而不失本格」（本气伤官主格、透财为相），与expected「用神申金伤官」更相合，结论不变；另按回修后第六步从化门复核，甲己合而不化，不转杂格"

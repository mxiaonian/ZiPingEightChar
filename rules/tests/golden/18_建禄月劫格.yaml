- id: 禄-M02
  name: "李知府"
  pillars: ["丁酉", "丙午", "丁巳", "壬寅"]
  book_verdict: "禄劫用官而财助，贵格"
  expected: "建禄月劫格/成/用神正官、相神财（财助官）"
  source: "《子平真诠》第四十五篇·论建禄月劫"
  derived: "丁日午月，午中丁为日主之禄（阴干非刃）→建禄月劫格；时干透壬正官为用，天干无财印透，但年支酉中辛偏财、时支寅中甲正印，支藏有气——回修后 R-禄-03 条件为『财或印与官相随（透干或支藏有气皆可）』，条文径以本造（李知府）为书证，条件触发→成格；用神壬官、相神辛财（财生官、财助官）。"
  result: "match"
  note: "回修后已消解：上一轮 R-禄-03 条件写作『财或印随官而透』，严于原文『又要财印相随』，本造财印仅在支而不透，落入不成不破之灰区，判 mismatch；回修后条件放宽为『透干或支藏有气皆可』并直接援引本造为据，成格判定成立，与书中『禄劫用官而财助，贵格』一致。"

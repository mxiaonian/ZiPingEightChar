# 黄金命例：阳刃格  来源：17_阳刃格.md 命例栏
- id: 刃-M01
  name: "无名"
  pillars: ["己酉", "丙子", "壬寅", "丙午"]
  book_verdict: "官透有力，旺财生之，丞相命"
  expected: "阳刃格/成/用神己土正官制刃，丙火偏财为相生官（财相随）；官透有力、旺财生之，贵大"
  source: "第四十三篇·论阳刃"
  derived: "阳刃格/成/用己官制刃、丙财为相，贵大。月令子，壬日子月：壬禄在亥、禄前一位为子，子中本气癸为劫财，月令无用神，阳干临刃，总纲第二步路由转阳刃格（R-刃-01）。第三步藏干变化：子为四仲专气，无藏干变化。审配合：年干透己正官（土克壬异性为官），官能制刃，触 R-刃-02「刃宜伏制、官煞皆宜」与 R-刃-03「阳刃用官透刃不虑」；月时两透丙偏财（火为壬财、丙同性为偏），时支午为丙财临官旺地，财生官而相随，触 R-刃-02「财印相随尤为贵显」。天干无丁（壬之刃干）扰官，亦无伤食克官。官透有力、旺财生之，合 R-刃-13 官煞露而根深贵大之断。"
  result: "match"
  note: "月支子刃与时支午财子午相冲，刃财相冲在规则条文中无对应处置（R-刃-09「刃财相搏」限以财为用且无伤食通关之局，此处用官非用财，不触），书中仍判丞相命；规则未覆盖此点，不影响成格判定。四柱遁合无失配。"

- id: 刃-M02
  name: "无名"
  pillars: ["辛酉", "甲午", "丙申", "壬辰"]
  book_verdict: "透煞根浅，财印助之，亦丞相命"
  expected: "阳刃格/成/用神壬水七煞制刃（阳刃用煞反喜财印），辛财、甲印相随为相；煞根浅而财印助之，亦贵"
  source: "第四十三篇·论阳刃"
  derived: "阳刃格/成/用壬煞制刃、辛财甲印为相，贵。丙日午月：丙禄在巳、禄前一位为午，午中丁劫财为刃，阳干临刃，总纲第二步转阳刃格（R-刃-01）。时干透壬七煞（水克丙同性为煞）制刃，触 R-刃-02；天干不透丁（丙之刃干），故不触 R-刃-07「透刃合煞、贪合忘克」之忌。年干透辛正财、月干透甲偏印——阳刃用煞赖煞制刃不怕伤身，「反喜财印、忌制伏其煞」，财印相随正触 R-刃-02 之喜；又 R-刃-04 丙生午月内藏己土暗伤水煞「尤宜带财佩印」，辛财甲印恰符其配合。壬煞之根仅日支申中壬水长生、时支辰中癸余气，根浅；得财印助之，合 R-刃-13「根浅而得财印助之者亦可至贵」之断。"
  result: "match"
  note: "书中判「透煞根浅」，然日支申为壬水长生，煞非全无根；「根浅」当系相对「根深」之辞，不改变成格结论，存此备考。四柱遁合无失配。"

- id: 刃-M03
  name: "穆同知"
  pillars: ["甲午", "癸酉", "庚寅", "戊寅"]
  book_verdict: "癸水伤寅午之官，而戊以合之，印护而贵"
  expected: "阳刃格/成（败中有救·印护）/用神丁火正官（年支午中，寅午会局）制刃；带忌：月干癸水伤官克官；救：时干戊土偏印合癸，伤不能克官；相神为戊印"
  source: "第四十三篇·论阳刃"
  derived: "阳刃格/成（救·印护）/用丁官制刃，戊印合伤为相。庚日酉月：庚禄在申、禄前一位为酉，酉中辛劫财为刃，阳干临刃，总纲第二步转阳刃格（R-刃-01）。官星丁火不透干，藏年支午中，得日支寅与午半合火局（R-纲-08 半合拱局亦足参变化）而有力，用官制刃成立，触 R-刃-02。月干透癸伤官，癸克丁官，成中带忌（R-纲-05）；时干透戊偏印，戊癸相合，合住伤食使不能克官煞——触 R-刃-10「官煞制刃带伤食、天干透印合住伤食则印护成格」之条件，败中有救。年干甲偏财生官，于格有辅。"
  result: "match"
  note: "官藏于支（午中丁）而不透干，R-刃-10「印护」之条件未限定官煞必须透干，其引例即本命，触发无疑义。四柱遁合无失配。"

- id: 刃-M04
  name: "贾平章"
  pillars: ["甲寅", "庚午", "戊申", "甲寅"]
  book_verdict: "煞两透而根太重，食以制之，裁损而贵"
  expected: "阳刃格/成（败中有救·裁损）/用神甲木七煞制刃；煞两透、根太重为忌；救：月干庚金食神制煞，轻重得宜；相神为庚食"
  source: "第四十三篇·论阳刃"
  derived: "阳刃格/成（救·裁损）/用甲煞制刃、庚食制煞为相。戊日午月：戊禄在巳、禄前一位为午，午中己劫财为刃（戊以午为刃，土随火论），阳干临刃，总纲第二步转阳刃格（R-刃-01）。年时两透甲七煞，各坐寅禄，煞两透而根太重——用煞制刃而煞过重，制刃太过为忌；月干透庚食神，通根日支申禄，食有力制煞，触 R-刃-11「煞太重、带食神制之则裁损成格」之条件，败中有救，轻重得宜而贵。"
  result: "match"
  note: "两寅冲日支申，相神庚食之根受冲，规则条文未论及相神之根被冲之处理，书中仍判贵（贾平章）；存此备考。四柱遁合无失配。"

- id: 刃-M05
  name: "无名"
  pillars: ["丙戌", "丁酉", "庚申", "壬午"]
  book_verdict: "壬合丁官，煞纯而不杂，阳刃利于留煞，取清成格"
  expected: "阳刃格/成（败中有救·取清）/官煞并透混杂为忌；时干壬水食神合去丁官、独留丙煞制刃，煞纯不杂；相神为壬食（合官留煞）"
  source: "第四十三篇·论阳刃"
  derived: "阳刃格/成（救·取清）/合官留煞，壬食为相。庚日酉月：庚禄在申、禄前一位为酉，酉中辛劫财为刃，阳干临刃，总纲第二步转阳刃格（R-刃-01）。年干透丙七煞、月干透丁正官，官煞并透混杂为忌；时干透壬食神，丁壬相合，合去丁官、独留丙煞制刃——触 R-刃-12「官煞竞出、有干合去官星独留煞制刃则取清」之条件，败中有救成格；阳刃之格利于留煞。回修后 R-刃-12 已明定「合优先于克（贪合忘克）：食既合官留煞，不以其克煞触 R-刃-02 之忌论」，故壬食合官之功优先，不以壬本可克丙煞而触「用煞忌制伏」之忌。丙煞坐戌通根火库、得时支午旺地，煞透根深，合 R-刃-13 贵大之象。"
  result: "match"
  note: "回修后已消解：上一轮指出「阳刃用煞忌制伏其煞」（R-刃-02）与时干壬食并存存在规则张力、条文未明写合与克之优先级；本轮 R-刃-12 已补「合优先于克（贪合忘克）：食既合官留煞，不以其克煞触 R-刃-02 之忌论」，优先级明文入规，张力消解，判定路径完全自洽。四柱遁合无失配。"

  source: "《子平真诠》第三十一篇·论正官"
  derived: "正官格（化官为印）/成/月令亥本气壬水为丁火正官定格（第二步）；亥藏壬甲，无他干透出，第三步不触发；年卯月亥日未三合木局，依总纲第四步及R-纲-08会支变化，月令之气随局而化、格随所化，化官为印（第十篇·论用神变化正引此例：丁生亥月支全卯未则化为印）；时干庚正财透出，触发R-官-04（化官为印而透财）→成格甚秀，大贵之格；天干乙丁丁庚，无伤官透干、无七煞混杂，符存喜去忌"
  result: "match"
  note: "标注问题仍未消解：按条件字段独立路由最贴合R-官-04（化官为印而透财），而分格文件命例栏仍标示范R-官-02——原书此例紧承『若化官为印而透财，则又为甚秀，大贵之格也』句下，建议改标R-官-04（兼R-官-01存喜去忌），本轮回修未及此处。年干乙偏印与时干庚正财年时遥隔，不作合论，R-官-12不触发。日支未与时支戌相刑（兼破），原书未论；未入亥卯未之会，依R-官-11会合解刑，不影响结论。"
- id: 官-M04
  name: "宣参国"
  pillars: ["己卯", "辛未", "壬寅", "辛亥"]
  book_verdict: "未中己官透干用清，支会水局（伤），两辛印解之，遇伤佩印"
  expected: "正官格/救（遇伤佩印，败中有成）/用神=未中己土正官透干；支会伤官之局为忌，两辛正印透干制伤护官为相"
  source: "《子平真诠》第三十一篇·论正官"
  derived: "正官格（杂气）/救（成）/月令未本气己土为壬水正官且透年干，透干用清，依总纲第三步及R-纲-10一透一用，定格杂气正官；年卯月未时亥三合木局、日寅时亥又六合化木（R-纲-08回修后六合亦足参变化），木为壬水伤食（卯中乙=伤官），支会伤官之局，触发R-官-06（遇伤带忌）；月时两辛正印并透，触发R-官-08（遇伤佩印：官格含藏干透出取清者，支会伤官之局，透印制伤护官）→救应成格；无财星透干，R-官-07不触发"
  result: "match"
  note: "文本问题仍未消解：命例栏『支会水局』照录原书（sources/32_论正官.md同），但与四柱不符——亥卯未所会为木局非水局，且对壬水日主水为比劫非伤，与栏内自注『（伤）』及『遇伤佩印』判定自相矛盾，『水』疑为『木』之传抄讹字；上一轮建议规则库加校注，本轮回修未落实，分格文件命例栏此处仍无存疑校注（建议照M02之例补注，不改原文）。判定不受影响。"

  pillars: ["庚寅", "乙酉", "甲子", "戊辰"]
  book_verdict: "甲用酉官，庚金七煞混杂，乙劫合庚，合煞留官取清"
  expected: "正官格/救（混煞取清，败中有成）/用神=酉中辛金正官；庚煞透干混杂为忌，月干乙劫财合庚煞，合煞留官为相"
  source: "《子平真诠》第三十一篇·论正官"
  derived: "正官格/救（成）/月令酉专气辛金为甲木正官定格（第二步，子午卯酉专气无藏干变化）；年干庚七煞透出混官，触发R-官-06（混煞带忌）；月干乙劫财与庚相邻而乙庚相合，触发R-官-09（干透七煞混杂，另有天干与煞相合，劫财合煞）→合煞留官取清，救应成格"
  result: "match"
  note: "日支子与月支酉相破，R-官-05条件含『破』，字面被触发；时支辰与酉六合可解。上一轮指出的豁免顺序问题回修后已部分消解：R-官-05已补『但刑冲得会合而解者不破』豁免；然豁免字面仅赅『刑冲』，未明及『破害』，本案子酉破得辰酉合解仍须类推R-官-11（第八篇·论刑冲会合解法『有辰则酉与辰合而不冲』之例亦仅言冲）——建议R-官-05豁免措辞扩为刑冲破害得会合而解者不破。判定不受影响，与原书一致。"

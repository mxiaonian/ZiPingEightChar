# 黄金命例：正官格  来源：11_正官格.md 命例栏
- id: 官-M01
  name: "薛相公"
  pillars: ["甲申", "壬申", "乙巳", "戊寅"]
  book_verdict: "壬印戊财并透，以日主乙隔之，水与土两不相碍，故大贵"
  expected: "正官格/成/用神=申中庚金正官；相神=壬印戊财并透（财生官、印护官），中有日主相隔两不相碍，大贵"
  source: "《子平真诠》第三十一篇·论正官"
  derived: "正官格/成/月令申本气庚金为乙木正官定格（第二步）；申藏庚壬戊，本气庚不透而透壬印戊财（皆申中所藏），依回修后总纲第三步辨主从——戊财生庚官（透干生本气）、庚官生壬印（本气生透干）、本气庚当令有力，为变而不失本格，本气正官仍主格，财印为相为辅；年月日时干序甲壬乙戊，壬印与戊财之间隔日主乙，不相克不相合，触发R-官-02（财印并透两不相碍）→成格大贵"
  result: "match"
  note: "时支寅冲月支申、寅巳申三刑并存，R-官-05条件被触发；日支巳与申六合。上一轮指出的两处规则措辞问题回修后已消解：①R-官-05已明补『但刑冲得会合而解者不破』豁免，且正引本造（薛相公造寅申冲得巳申合解仍成）为例，豁免顺序不再缺失；②总纲第三步已补『辨主从』（透干与本气相生、本气当令有力则本气仍主格），本造透壬透戊皆与庚官相生，路由直接命中变而不失本格（第十篇·论用神变化乙生申月透壬透戊、财能生官之例正在变而不失本格段），无须再绕引R-纲-07。判定与原书大贵一致。"
- id: 官-M02
  name: "无名"
  pillars: ["壬戌", "丁未", "戊甲", "乙卯"]
  book_verdict: "杂气正官透干会支，本最贵格；然壬财丁印二者相合，以孤官无辅论，不上七品"
  expected: "正官格（杂气）/成而降等/用神=未中乙木正官（透干、卯未会支）；壬财丁印并透而相合，两失其用，孤官无辅，不上七品"
  source: "《子平真诠》第三十一篇·论正官"
  derived: "正官格（杂气）/成而降等/日干戊，月支未为杂气（四墓），本气己土劫财不透，藏干丁印乙官并透；依总纲第三步及R-纲-10杂气取用，透干会支取其清者用之——乙官透干、时支卯与月支未半合木（官）局（R-纲-08回修后已明补半合拱局亦足参变化），定格杂气正官；年干壬偏财与月干丁正印相邻而丁壬相合，触发R-官-12（财印并透而相合，两失其用，孤官无辅）→成格降等，不上七品"
  result: "match"
  note: "日柱『戊甲』干支失配（甲为天干不能居日支），原书即如此，分格文件已存疑照录，属原书文本问题，无法消解；日干戊可定，乙=正官、丁=正印、壬=偏财十神自洽，核心判定（丁壬合、卯未半合）不涉日支，仍可验证。回修后R-纲-08补六合半合，本造卯未半合官局之会支依据由类推转为明文。新观察（轻微路由歧义，不影响判定）：第二步比劫分支字面可捕获四墓月本气为比劫者（戊生未月本气己土劫财），须借第三步/R-纲-10杂气取用归正，而建禄月劫路由亦以透干别取官为用，两线同归。年支戌与月支未相刑、与时支卯六合，原书未论，不影响结论。"

  book_verdict: "概云木透月干，春木足以生火，年干壬水生木，日时两坐长生，皆作旺论。惜地支土金太重，天干水木之根必浅，水木无气，则丁火之荫不固；甲木生于季春，退气之神也，辰酉合而化金，则甲木之余气已绝；戌土隔之，使金不能生水，戌土足以制之，壬水受克，不能生木；辰酉化金，必能克木，日主根源不固可知；如谓酉是丁火长生，五行颠倒矣；更嫌时干己土，窃去命主元神，生金泄火，而水木火三字皆虚矣。后果夭于癸酉年"

  name: "贫·印旺财孤食土虚浮（丁火生寅月）"
  pillars: ["癸卯", "甲寅", "丁巳", "己酉"]
  luck: ["癸丑", "壬子", "辛亥", "庚戌", "己酉", "戊申"]
  book_verdict: "此造财藏杀露，杀印相生，又联珠相生，似乎贵格，所以祖业二十余万；不知年干之杀无根，其菁华尽被印绶窃去，必用酉金之财，盖头覆之以土，似科有情，但木旺土虚，相火逢生，则巳酉不会，财不真矣。一交壬子，泄金生木，一败如灰；至亥支，印遇长生，竟遭饿死"

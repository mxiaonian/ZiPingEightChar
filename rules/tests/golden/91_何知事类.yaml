  derived: "旺衰口径：壬水生子月当令，子为羊刃，年支申为长生且申子半会水局，时支亥为禄地，身旺无疑；财仅月干丙火一点，冬月火弱，然通根日支寅（寅中丙）为木火生地，寅亥合木、食神生财，财有源头而局无官印破格——对照 R-事-02 条件「伤官（食神）重而财神流通」及判定「财星不多，只要生化有情」，触发 R-事-02 → 主富，与书判「富有百余万」合"
  result: match
  note: "无"

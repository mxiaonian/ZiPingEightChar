  book_verdict: "庚金生于立夏前五日，土当令，火未司权，庚金之生坐实，且辰支申昌，生扶并旺，身强杀浅。嫌其财露无根逢劫，所以出身贫寒；一交丁运，官星元神发露，戊寅己卯两年，财星得地，喜用齐来，科甲联登，又入词林。书云，以杀化权，定显塞门贵客，此之谓也"
  expected: "R-事-03 官星有理会（身旺官弱，运助官星、财能生官）→ 主贵"
